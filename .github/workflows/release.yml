name: Build and publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Windows builds are temporarily paused; publish only checked Linux assets.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check package imports without server dependencies
        run: python -B -m unittest discover -s tests -p test_package_import.py -v
      - name: Build Linux executable
        run: ./client/build.sh
      - name: Check standalone executable startup
        run: python client/check_executable.py dist/gemini-cli
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-cli-linux-x64
          path: dist/gemini-cli
          if-no-files-found: error

  publish:
    needs: [linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gemini-cli-linux-x64
          path: release-assets
      - name: Publish checked executables and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-assets/gemini-cli release-assets/gemini-cli-linux-x64
          chmod +x release-assets/gemini-cli-linux-x64
          (cd release-assets && sha256sum gemini-cli-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release-assets/gemini-cli-linux-x64 release-assets/SHA256SUMS --verify-tag --draft \
            --title "Gemini CLI $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
