name: Build and publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check package imports without server dependencies
        run: python -B -m unittest discover -s tests -p test_package_import.py -v
      - name: Build Linux executable
        run: ./client/build.sh
      - name: Check S4 context and recovery contracts
        run: .venv/bin/python -B -m unittest tests.test_context_selection tests.test_context_info tests.test_compaction tests.test_chat_buffers tests.test_local_chats tests.test_local_chats_v2 tests.test_local_chat_state tests.test_local_fork tests.test_local_summary_cancel tests.test_local_recovery_backend tests.test_local_history_apis tests.test_ui_context tests.test_stream_display tests.test_profiles -q
      - name: Check standalone executable startup
        run: python client/check_executable.py dist/gemini-cli
      - name: Check packaged document parsers
        run: python client/check_documents.py dist/gemini-cli
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-cli-linux-x64
          path: dist/gemini-cli
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check package imports without server dependencies
        run: python -B -m unittest discover -s tests -p test_package_import.py -v
      - name: Build Windows executable
        shell: pwsh
        run: ./client/build.ps1
      - name: Check S4 context and recovery contracts
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_context_selection tests.test_context_info tests.test_compaction tests.test_chat_buffers tests.test_local_chats tests.test_local_chats_v2 tests.test_local_chat_state tests.test_local_fork tests.test_local_summary_cancel tests.test_local_recovery_backend tests.test_local_history_apis tests.test_ui_context tests.test_stream_display tests.test_profiles -q
      - name: Check Windows executable header
        shell: pwsh
        run: |
          $stream = [System.IO.File]::OpenRead('dist/gemini-cli.exe')
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw 'Windows executable has no PE header.'
            }
          } finally {
            $stream.Dispose()
          }
      - name: Check standalone executable startup
        shell: pwsh
        run: python client/check_executable.py dist/gemini-cli.exe
      - name: Check packaged document parsers
        shell: pwsh
        run: python client/check_documents.py dist/gemini-cli.exe
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-cli-windows-x64
          path: dist/gemini-cli.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gemini-cli-linux-x64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: gemini-cli-windows-x64
          path: release-assets
      - name: Publish checked executables and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-assets/gemini-cli release-assets/gemini-cli-linux-x64
          mv release-assets/gemini-cli.exe release-assets/gemini-cli-windows-x64.exe
          chmod +x release-assets/gemini-cli-linux-x64
          test -s release-assets/gemini-cli-linux-x64
          test -s release-assets/gemini-cli-windows-x64.exe
          (cd release-assets && sha256sum gemini-cli-linux-x64 gemini-cli-windows-x64.exe > SHA256SUMS && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" release-assets/gemini-cli-linux-x64 release-assets/gemini-cli-windows-x64.exe release-assets/SHA256SUMS --verify-tag --draft \
            --title "Gemini CLI $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
