name: Build Windows client

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check package import without dependencies
        run: python -B -m unittest discover -s tests -p test_package_import.py -v

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build executable
        shell: pwsh
        run: ./client/build.ps1
      - name: Check executable
        shell: pwsh
        run: |
          $exe = 'dist/gemini-cli.exe'
          if (-not (Test-Path $exe)) { throw 'Windows executable is missing.' }
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw 'Windows executable has no PE header.'
            }
          } finally {
            $stream.Dispose()
          }
      - name: Check standalone executable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/gemini-cli.exe').Path
          $smokeHome = Join-Path $env:RUNNER_TEMP 'gemini-cli-smoke'
          $config = Join-Path $smokeHome '.gemini_cli'
          New-Item -ItemType Directory -Force $config | Out-Null
          '{"server_url":"http://localhost:9"}' | Set-Content (Join-Path $config 'server_config.json')
          '{"access_token":"smoke-fixture-token"}' | Set-Content (Join-Path $config 'session.json')
          $env:USERPROFILE = $smokeHome
          $env:HOME = $smokeHome
          foreach ($name in 'API_KEY', 'SUPABASE_URL', 'SUPABASE_ANON_KEY', 'TAVILY_API_KEY') {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          Set-Location $smokeHome
          $output = & $exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Output $output
            throw 'Standalone executable startup failed.'
          }
          if ($output -match 'Traceback|ModuleNotFoundError') { throw 'Standalone import check failed.' }
          Write-Output 'Standalone startup passed with an offline fixture server and no server keys.'
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-cli-windows-x64
          path: dist/gemini-cli.exe
          if-no-files-found: error
