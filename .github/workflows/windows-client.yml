name: Build Windows client

on:
  push:
    branches: [dev, 'feature/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-input:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install standalone client dependencies
        run: python -m pip install -r client/requirements-local.txt
      - name: Check input and image contracts
        run: python -B -m unittest tests.test_backend_imports tests.test_clipboard tests.test_clipboard_linux tests.test_clipboard_windows tests.test_draft tests.test_draft_input tests.test_large_paste tests.test_input_completion tests.test_file_attachment tests.test_workspace_snapshot tests.test_image_preview tests.test_text_editor tests.test_input_regressions tests.test_images_contract tests.test_manual_shell tests.test_shell_pty tests.test_work_input_pty tests.test_term_command tests.test_managed_process tests.test_windows_job tests.test_turn_state tests.test_stream_cancel tests.test_remote_http_cancel tests.test_remote_work_auth tests.test_work_input tests.test_work_view tests.test_execution_steps tests.test_runtime_history -q
      - name: Check S4 context and recovery contracts
        run: python -B -m unittest tests.test_context_selection tests.test_context_info tests.test_compaction tests.test_chat_buffers tests.test_local_chats tests.test_local_chats_v2 tests.test_local_chat_state tests.test_local_fork tests.test_local_summary_cancel tests.test_local_recovery_backend tests.test_local_history_apis tests.test_ui_context tests.test_stream_display tests.test_profiles -q
      - name: Build and check Linux executable
        run: |
          ./client/build.sh
          python client/check_executable.py dist/gemini-cli
      - name: Check MCP transports and toolsets
        run: python -B -m unittest tests.test_mcp_config tests.test_mcp_schema tests.test_mcp_transport tests.test_mcp_http tests.test_mcp_auth tests.test_mcp_runner tests.test_mcp_commands tests.test_mcp_secret tests.test_mcp_backend tests.test_mcp_pty -q
      - name: Check subscription status UI
        run: python -B -m unittest tests.test_quota_view tests.test_status_pty -q
      - name: Check portable skills
        run: python -B -m unittest tests.test_skills tests.test_skill_backend tests.test_skill_commands tests.test_skill_resources tests.test_skill_pty tests.test_integration_help -q
      - name: Check development tools
        run: python -B -m unittest tests.test_symbols tests.test_lsp tests.test_lsp_tools tests.test_lsp_edits tests.test_structured_tests tests.test_affected tests.test_git_tools tests.test_git_commit tests.test_github_pr tests.test_development_help tests.test_development_pty -q
      - name: Check real Python language server
        run: |
          python -m venv "$RUNNER_TEMP/pylsp"
          "$RUNNER_TEMP/pylsp/bin/python" -m pip install -r client/requirements-lsp.txt
          GEMINI_TEST_PYLSP="$RUNNER_TEMP/pylsp/bin/pylsp" python -B -m unittest tests.test_lsp_live -q
      - name: Check file changes and undo
        run: python -B -m unittest tests.test_changes tests.test_change_history tests.test_checkpoints tests.test_write_set tests.test_hunks tests.test_change_view tests.test_undo tests.test_changes_pty tests.test_input_completion -q
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-cli-linux-x64-preview
          path: dist/gemini-cli
          if-no-files-found: error

  package-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check package import without dependencies
        run: python -B -m unittest discover -s tests -p test_package_import.py -v

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build executable
        shell: pwsh
        run: ./client/build.ps1
      - name: Check input and image contracts
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_backend_imports tests.test_clipboard tests.test_clipboard_windows tests.test_draft tests.test_draft_input tests.test_large_paste tests.test_input_completion tests.test_file_attachment tests.test_workspace_snapshot tests.test_image_preview tests.test_text_editor tests.test_input_regressions tests.test_images_contract tests.test_manual_shell tests.test_shell_pty tests.test_work_input_pty tests.test_term_command tests.test_managed_process tests.test_windows_job tests.test_turn_state tests.test_stream_cancel tests.test_remote_http_cancel tests.test_remote_work_auth tests.test_work_input tests.test_work_view tests.test_execution_steps tests.test_runtime_history -q
      - name: Check S4 context and recovery contracts
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_context_selection tests.test_context_info tests.test_compaction tests.test_chat_buffers tests.test_local_chats tests.test_local_chats_v2 tests.test_local_chat_state tests.test_local_fork tests.test_local_summary_cancel tests.test_local_recovery_backend tests.test_local_history_apis tests.test_ui_context tests.test_stream_display tests.test_profiles -q
      - name: Check executable
        # Real Windows rendering remains a separate interactive check.
        shell: pwsh
        run: |
          $exe = 'dist/gemini-cli.exe'
          if (-not (Test-Path $exe)) { throw 'Windows executable is missing.' }
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw 'Windows executable has no PE header.'
            }
          } finally {
            $stream.Dispose()
          }
      - name: Check MCP transports and toolsets
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_mcp_config tests.test_mcp_schema tests.test_mcp_transport tests.test_mcp_http tests.test_mcp_auth tests.test_mcp_runner tests.test_mcp_commands tests.test_mcp_secret tests.test_mcp_backend tests.test_mcp_pty -q
      - name: Check subscription status UI
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_quota_view tests.test_status_pty -q
      - name: Check portable skills
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_skills tests.test_skill_backend tests.test_skill_commands tests.test_skill_resources tests.test_skill_pty tests.test_integration_help -q
      - name: Check development tools
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_symbols tests.test_lsp tests.test_lsp_tools tests.test_lsp_edits tests.test_structured_tests tests.test_affected tests.test_git_tools tests.test_git_commit tests.test_github_pr tests.test_development_help tests.test_development_pty -q
      - name: Check real Python language server
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/pylsp"
          & "$env:RUNNER_TEMP/pylsp/Scripts/python.exe" -m pip install -r client/requirements-lsp.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GEMINI_TEST_PYLSP = "$env:RUNNER_TEMP/pylsp/Scripts/pylsp.exe"
          ./.venv-win/Scripts/python.exe -B -m unittest tests.test_lsp_live -q
      - name: Check file changes and undo
        shell: pwsh
        run: ./.venv-win/Scripts/python.exe -B -m unittest tests.test_changes tests.test_change_history tests.test_checkpoints tests.test_write_set tests.test_hunks tests.test_change_view tests.test_undo tests.test_changes_pty tests.test_input_completion -q
      - name: Check standalone executable startup
        shell: pwsh
        run: python client/check_executable.py dist/gemini-cli.exe
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-cli-windows-x64
          path: dist/gemini-cli.exe
          if-no-files-found: error
