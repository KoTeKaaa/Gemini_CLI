{% extends 'base.html' %}
{% block content %}
<h1>Вход в аккаунт</h1>
<p>Владелец управляет подписками. Получатель ссылки входит для её активации.</p>
<form id="login">
  <label>Почта<input name="email" type="email" autocomplete="username" required maxlength="320"></label>
  <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
  <button type="submit">Войти</button>
</form>
{% endblock %}
